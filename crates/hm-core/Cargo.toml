[package]
name = "hm-core"
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core of the hm CLI: layered config/credentials + pluggable CI execution backends (local VM + cloud)."

[dependencies]
hm-common = { workspace = true }
hm-plugin-protocol = { workspace = true }
hm-pipeline-ir = { workspace = true }
hm-vm = { workspace = true, features = ["docker-backend"] }
harmont-cloud = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
figment = { workspace = true }
derive_more = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
human-units = { workspace = true }
tar = "0.4"
flate2 = "1"
ignore = "0.4"
tempfile = "3"
daggy = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
rstest = { workspace = true }
# `test` brings in `figment::Jail` for isolated env-var/cwd testing.
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
